services:
  app:
    build: .
    restart: unless-stopped
    profiles:
      - app
    depends_on:
      - redis
    volumes:
      - ./.config.json:/app/config.json:ro
    environment:
      - SF_REDIS_HOST=redis
      - SF_BOTS_CONFIG_PATH=/app/config.json

  redis:
    restart: unless-stopped
    image: redis:8.2.2
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
